[package]
name = "argon-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Local coding agent harness for the Argon Gemini web bridge"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
fs2 = "0.4"
ignore = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
